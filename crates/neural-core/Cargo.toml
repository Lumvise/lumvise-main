[package]
name = "lumvise-neural-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
assistant-e2e = []
fastembed = ["dep:fastembed"]
kokoros = ["dep:sherpa-onnx"]
native-voice = ["kokoros", "whisper-rs"]
native-vector = ["fastembed"]
whisper-rs = ["dep:whisper-rs"]

[dependencies]
base64 = "0.22"
dirs.workspace = true
libc.workspace = true
fastembed = { workspace = true, optional = true }
lumvise-db-core.workspace = true
jsonschema = { version = "0.40", default-features = false }
lumvise-resource-routing.workspace = true
prost.workspace = true
bzip2.workspace = true
parking_lot.workspace = true
metrics.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sherpa-onnx = { workspace = true, optional = true }
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
tracing.workspace = true
tungstenite.workspace = true
toml.workspace = true
tar.workspace = true
tokio-util.workspace = true
whisper-rs = { workspace = true, optional = true }
url.workspace = true
uuid.workspace = true

# GPU acceleration when available: whisper.cpp Metal backend on Apple targets.
# Cargo unions these features with the base optional dep above, so `metal` is
# added only on macOS; other platforms keep the CPU (Accelerate/OpenBLAS) path.

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys.workspace = true
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { workspace = true, optional = true, features = ["metal"] }

[dev-dependencies]
rodio.workspace = true
tempfile.workspace = true
