[package]
name = "lumvise-plugin-semantic"
version = "0.1.30"
edition.workspace = true
rust-version.workspace = true
license = "LGPL-3.0-only"

[dependencies]
chrono.workspace = true
lumvise-contracts.workspace = true
lumvise-plugin-package.workspace = true
lumvise-plugin-protocol.workspace = true
lumvise-plugin-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
regex = "1.12"
sha2 = "0.10"

[dev-dependencies]
lumvise-plugin-sdk = { workspace = true, features = ["test-support"] }
ed25519-dalek = "2.1"
hex = "0.4"
lumvise-app-core.workspace = true
lumvise-db-core.workspace = true
lumvise-resource-routing.workspace = true
lumvise-plugin-runtime.workspace = true
tempfile.workspace = true
zip = "2.4"

[[bin]]
name = "lumvise-plugin-semantic"
path = "src/main.rs"
