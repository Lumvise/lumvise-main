[package]
name = "lumvise-db-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
rmp-serde = "1.3"
chrono.workspace = true
grafeo = { version = "=0.6.1", default-features = false, features = ["storage"] }
grafeo-core = { version = "=0.6.1", default-features = false, features = ["lpg", "vector-index"] }
metrics.workspace = true
lumvise-resource-routing.workspace = true
rusqlite.workspace = true
lumvise-contracts.workspace = true
lumvise-semantic-revisions.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
arrow-array = "59.1.0"
arrow-schema = "59.1.0"
parquet = { version = "59.1.0", default-features = false, features = ["arrow", "zstd"] }
sha2.workspace = true
zip = { version = "2.4.2", default-features = false }
bytes.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
grafeo-common = { version = "=0.6.1", features = ["testing-crash-injection"] }
grafeo-engine = { version = "=0.6.1", default-features = false, features = ["lpg"] }
grafeo-storage = { version = "=0.6.1", default-features = false, features = ["wal"] }
